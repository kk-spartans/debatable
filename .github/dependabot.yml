version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: daily
    commit-message:
      prefix: "deps"
    groups:
      production-dependencies:
        dependency-type: production
      dev-dependencies:
        dependency-type: development

  - package-ecosystem: bun
    directory: "/"
    schedule:
      interval: daily
    commit-message:
      prefix: "deps"
    groups:
      production-dependencies:
        dependency-type: production
      dev-dependencies:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps"
    groups:
      production-dependencies:
        dependency-type: production
      dev-dependencies:
        dependency-type: development
