name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v16
        with:
          name: devenv

      - run: nix profile add nixpkgs#devenv

      - name: Save previous tag
        id: pre
        run: echo "tag=$(git tag --list 'v*' --sort=-version:refname | head -1)" >> "$GITHUB_OUTPUT"

      - name: Semantic Release
        run: devenv tasks run debatable:release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for new release
        id: check
        run: |
          TAG=$(git tag --list 'v*' --sort=-version:refname | head -1)
          PREV="${{ steps.pre.outputs.tag }}"
          if [ -z "$TAG" ] || [ "$TAG" = "$PREV" ]; then
            echo "No new release, skipping artifact build"
            exit 0
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Install platform native deps for all targets
        if: steps.check.outputs.version != ''
        run: |
          bun install --frozen-lockfile --no-verify --cpu arm64 --os linux
          bun install --frozen-lockfile --no-verify --cpu x64 --os darwin
          bun install --frozen-lockfile --no-verify --cpu arm64 --os darwin
          bun install --frozen-lockfile --no-verify --cpu x64 --os win32
          bun install --frozen-lockfile --no-verify --cpu arm64 --os win32

      - name: Build and upload release artifacts
        if: steps.check.outputs.version != ''
        run: |
          TAG="v${{ steps.check.outputs.version }}"
          echo "Building release artifacts for $TAG"

          mkdir -p artifacts

          for plat in linux-x64 linux-arm64 darwin-x64 darwin-arm64; do
            bun build --compile --outfile "artifacts/debatable" --target "bun-$plat" src/index.tsx
            (cd artifacts && zip -r "../debatable-$plat.zip" debatable)
            rm artifacts/debatable
          done

          for plat in windows-x64 windows-arm64; do
            bun build --compile --outfile "artifacts/debatable.exe" --target "bun-$plat" src/index.tsx
            (cd artifacts && zip -r "../debatable-$plat.zip" debatable.exe)
            rm artifacts/debatable.exe
          done

          gh release upload "$TAG" debatable-*.zip --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        if: steps.check.outputs.version != ''
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: steps.check.outputs.version != ''
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        if: steps.check.outputs.version != ''
        uses: docker/build-push-action@v6
        with:
          context: .
          file: devops/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/debatable-app:latest
            ghcr.io/${{ github.repository }}/debatable-app:${{ github.sha[0:7] }}
            ghcr.io/${{ github.repository }}/debatable-app:v${{ steps.check.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
