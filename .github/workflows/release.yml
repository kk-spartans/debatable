name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile --no-verify

      - name: Save previous tag
        id: pre
        run: echo "tag=$(git tag --list 'v*' --sort=-version:refname | head -1)" >> "$GITHUB_OUTPUT"

      - name: Semantic Release
        run: bun run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and upload release artifacts
        run: |
          TAG=$(git tag --list 'v*' --sort=-version:refname | head -1)
          PREV="${{ steps.pre.outputs.tag }}"
          if [ -z "$TAG" ] || [ "$TAG" = "$PREV" ]; then
            echo "No new release published, skipping artifact build"
            exit 0
          fi
          echo "Building release artifacts for $TAG"
          for target in \
            x86_64-unknown-linux-gnu \
            aarch64-unknown-linux-gnu \
            x86_64-apple-darwin \
            aarch64-apple-darwin \
            x86_64-pc-windows-msvc \
            aarch64-pc-windows-msvc
          do
            bun build --compile --outfile "debatable-$target" --target "bun-$target" src/index.tsx
          done
          gh release upload "$TAG" debatable-* --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
