name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile --no-verify

      - name: Save previous tag
        id: pre
        run: echo "tag=$(git tag --list 'v*' --sort=-version:refname | head -1)" >> "$GITHUB_OUTPUT"

      - name: Semantic Release
        run: bun run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and upload release artifacts
        run: |
          TAG=$(git tag --list 'v*' --sort=-version:refname | head -1)
          PREV="${{ steps.pre.outputs.tag }}"
          if [ -z "$TAG" ] || [ "$TAG" = "$PREV" ]; then
            echo "No new release published, skipping artifact build"
            exit 0
          fi
          echo "Building release artifacts for $TAG"
          bun build --compile --outfile debatable-linux-x64 --target bun-linux-x64 src/index.tsx
          bun build --compile --outfile debatable-linux-arm64 --target bun-linux-arm64 src/index.tsx
          bun build --compile --outfile debatable-darwin-x64 --target bun-darwin-x64 src/index.tsx
          bun build --compile --outfile debatable-darwin-arm64 --target bun-darwin-arm64 src/index.tsx
          bun build --compile --outfile debatable-windows-x64.exe --target bun-windows-x64 src/index.tsx
          bun build --compile --outfile debatable-windows-arm64.exe --target bun-windows-arm64 src/index.tsx
          gh release upload "$TAG" debatable-* --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
