name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v16
        with:
          name: devenv

      - run: nix profile add nixpkgs#devenv

      - name: Save previous tag
        id: pre
        run: echo "tag=$(git tag --list 'v*' --sort=-version:refname | head -1)" >> "$GITHUB_OUTPUT"

      - name: Semantic Release
        run: devenv tasks run debatable:release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for new release
        id: check
        run: |
          TAG=$(git tag --list 'v*' --sort=-version:refname | head -1)
          PREV="${{ steps.pre.outputs.tag }}"
          if [ -z "$TAG" ] || [ "$TAG" = "$PREV" ]; then
            echo "No new release, skipping artifact build"
            exit 0
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Build and upload release artifacts
        if: steps.check.outputs.version != ''
        run: devenv tasks run debatable:publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        if: steps.check.outputs.version != ''
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate short SHA
        id: sha
        run: echo "short=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Build Docker image with Nix
        if: steps.check.outputs.version != ''
        run: nix build .#docker

      - name: Load and push Docker image
        if: steps.check.outputs.version != ''
        run: |
          docker load < result
          IMAGE="ghcr.io/${{ github.repository }}/debatable-app"
          docker tag "$IMAGE:latest" "$IMAGE:${{ steps.sha.outputs.short }}"
          docker tag "$IMAGE:latest" "$IMAGE:v${{ steps.check.outputs.version }}"
          docker push "$IMAGE:latest"
          docker push "$IMAGE:${{ steps.sha.outputs.short }}"
          docker push "$IMAGE:v${{ steps.check.outputs.version }}"
