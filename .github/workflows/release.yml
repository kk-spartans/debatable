name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      new_release_version: ${{ steps.semantic.outputs.new_release_version }}
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
    env:
      NPM_CONFIG_PROVENANCE: true
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v17
        with:
          name: devenv
      - name: Install devenv.sh
        run: nix profile add nixpkgs#devenv

      - name: Semantic Release
        id: semantic
        run: devenv tasks run debatable:release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ""
          NPM_CONFIG_PROVENANCE: true

  build-artifacts:
    needs: release
    if: needs.release.outputs.new_release_published == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - x86_64-apple-darwin
          - aarch64-apple-darwin
          - x86_64-pc-windows-msvc
          - aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v17
        with:
          name: devenv
      - name: Install devenv.sh
        run: nix profile add nixpkgs#devenv
      - name: Build
        run: bun build --compile --outfile dist/debatable --target bun-${{ matrix.target }} src/index.tsx
      - name: Package (Unix)
        if: ${{ !matrix.target.contains('windows') }}
        run: zip "debatable-${{ matrix.target }}.zip" dist/debatable
      - name: Package (Windows)
        if: ${{ matrix.target.contains('windows') }}
        run: zip "debatable-${{ matrix.target }}.zip" dist/debatable.exe
      - name: Upload release asset
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.release.outputs.new_release_version }}
          files: debatable-${{ matrix.target }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
