{
  "services":
    {
      "searxng":
        {
          "image": "searxng/searxng:latest",
          "volumes": ["./settings.yml:/etc/searxng/settings.yml:ro"],
          "restart": "unless-stopped",
          "cap_drop": ["ALL"],
          "cap_add": ["CHOWN", "SETGID", "SETUID"],
        },
      "debatable":
        {
          "image": "ghcr.io/kk-spartans/debatable/debatable-app:latest",
          "depends_on": ["searxng"],
          "env_file": ["../.env"],
          "environment": { "SEARXNG_BASE_URL": "http://searxng:8080" },
          "stdin_open": true,
          "tty": true,
        },
    },
}
